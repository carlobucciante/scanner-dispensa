<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<title>Scanner Dispensa</title>
<script src="https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js"></script>
<style>
  :root {
    --bg: #F2F2F7;
    --card: #FFFFFF;
    --fill: rgba(118, 118, 128, 0.12);
    --fill-forte: rgba(118, 118, 128, 0.2);
    --pollice: #FFFFFF;
    --ink: #000000;
    --ink-2: #636366;
    --sep: rgba(60, 60, 67, 0.18);
    --blu: #007AFF;
    --blu-velo: rgba(0, 122, 255, 0.12);
    --rosso: #D70015;
    --rosso-velo: rgba(255, 59, 48, 0.14);
    --arancio: #A84A00;
    --arancio-velo: rgba(255, 149, 0, 0.18);
    --verde: #34C759;
    --raggio: 16px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #000000;
      --card: #1C1C1E;
      --fill: rgba(118, 118, 128, 0.24);
      --fill-forte: rgba(118, 118, 128, 0.36);
      --pollice: #636366;
      --ink: #FFFFFF;
      --ink-2: #A1A1A8;
      --sep: rgba(84, 84, 88, 0.65);
      --blu: #0A84FF;
      --blu-velo: rgba(10, 132, 255, 0.2);
      --rosso: #FF6961;
      --rosso-velo: rgba(255, 69, 58, 0.22);
      --arancio: #FFB340;
      --arancio-velo: rgba(255, 159, 10, 0.22);
      --verde: #30D158;
    }
  }
  [data-luogo="DISPENSA"] { --luogo: #FF9500; }
  [data-luogo="FRIGO"]    { --luogo: #32ADE6; }
  [data-luogo="FREEZER"]  { --luogo: #5856D6; }
  [data-luogo="CANTINA"]  { --luogo: #AF52DE; }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { color-scheme: light dark; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", system-ui, "Segoe UI", Roboto, sans-serif;
    font-size: 17px;
    line-height: 1.35;
    letter-spacing: -0.01em;
    -webkit-font-smoothing: antialiased;
    -webkit-text-size-adjust: 100%;
  }
  button, input, select { font: inherit; letter-spacing: inherit; color: inherit; }
  button { cursor: pointer; border: none; background: none; padding: 0; }
  button:active { opacity: 0.6; }
  :focus-visible { outline: 3px solid var(--blu); outline-offset: 2px; }
  input:focus-visible, select:focus-visible { outline-offset: 0; }

  .wrap {
    max-width: 600px;
    margin: 0 auto;
    padding: calc(18px + env(safe-area-inset-top)) 16px calc(48px + env(safe-area-inset-bottom));
    display: flex;
    flex-direction: column;
    gap: 26px;
  }

  header { padding: 8px 4px 0; }
  h1 { font-size: 34px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.1; margin: 0; }
  .sub { color: var(--ink-2); font-size: 15px; margin: 4px 0 0; }

  .label {
    font-size: 13px; text-transform: uppercase; letter-spacing: 0.02em;
    color: var(--ink-2); margin: 0 0 7px; padding: 0 16px;
  }
  .nota { font-size: 13px; color: var(--ink-2); margin: 0; padding: 0 16px; }
  .nota.allarme { color: var(--arancio); font-weight: 600; }
  .nota:empty { display: none; }

  /* ---------- controllo a segmenti (dove stai guardando) ---------- */

  .segmenti { display: flex; background: var(--fill); border-radius: 10px; padding: 2px; }
  .seg {
    flex: 1; min-width: 0; height: 34px; border-radius: 8px;
    font-size: 14px; font-weight: 500;
    display: flex; align-items: center; justify-content: center; gap: 6px;
  }
  .seg::before, .chip[data-luogo]::before, .luogo::before {
    content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--luogo); flex: none;
  }
  .seg[aria-pressed="true"] {
    background: var(--pollice); font-weight: 600;
    box-shadow: 0 3px 8px rgba(0, 0, 0, 0.12), 0 1px 1px rgba(0, 0, 0, 0.04);
  }

  /* ---------- fotocamera ---------- */

  .camera {
    position: relative; aspect-ratio: 4 / 3;
    background: #0B0B0C; border-radius: var(--raggio); overflow: hidden;
    box-shadow: inset 0 0 0 1px var(--sep);
    display: flex; align-items: center; justify-content: center;
  }
  .camera video { width: 100%; height: 100%; object-fit: cover; display: block; }
  .camera.off video { display: none; }
  .mirino { position: absolute; inset: 16% 9%; border: 2px solid rgba(255, 255, 255, 0.75); border-radius: 14px; pointer-events: none; display: none; }
  .camera.on .mirino { display: block; }
  .mirino::after {
    content: ""; position: absolute; left: 10px; right: 10px; top: 50%;
    height: 2px; border-radius: 2px; background: #FF453A; box-shadow: 0 0 10px #FF453A;
    animation: sweep 2.4s ease-in-out infinite;
  }
  @keyframes sweep { 0%, 100% { transform: translateY(-38px); } 50% { transform: translateY(38px); } }
  @media (prefers-reduced-motion: reduce) { .mirino::after { animation: none; } }

  .camera-msg { position: absolute; padding: 20px; text-align: center; color: #EBEBF5; font-size: 15px; max-width: 330px; }
  .camera-msg b { display: block; font-size: 17px; font-weight: 600; color: #FFFFFF; margin-bottom: 6px; }
  .camera-msg .tecnico {
    display: block; margin-top: 12px; padding-top: 10px;
    border-top: 1px solid rgba(235, 235, 245, 0.25);
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: 11px;
    color: #AEAEB2; word-break: break-word;
  }
  .flash { position: absolute; inset: 0; background: #FFFFFF; opacity: 0; pointer-events: none; }
  .flash.go { animation: pop 0.42s ease-out; }
  @keyframes pop { 0% { opacity: 0.7; } 100% { opacity: 0; } }

  /* ---------- pulsanti ---------- */

  button.primary {
    background: var(--blu); color: #FFFFFF;
    font-weight: 600; border-radius: 14px;
    min-height: 50px; padding: 0 18px; width: 100%;
  }
  button.ghost {
    background: var(--blu-velo); color: var(--blu);
    font-weight: 600; border-radius: 14px;
    min-height: 50px; padding: 0 16px; white-space: nowrap;
  }
  .azioni-camera { display: flex; gap: 10px; margin-top: 12px; }
  .azioni-camera button.primary { flex: 1; }
  input[type="file"] { display: none; }

  /* ---------- caselle di inserimento ---------- */

  .manuale { display: flex; gap: 10px; }
  .manuale input, .sfuso input, .sfuso select {
    min-width: 0; height: 50px; padding: 0 14px;
    border: none; border-radius: 14px;
    background: var(--card); color: var(--ink);
  }
  .manuale input { flex: 1; font-variant-numeric: tabular-nums; }
  ::placeholder { color: var(--ink-2); opacity: 0.75; }
  .sfuso { display: grid; grid-template-columns: 84px 1fr auto; gap: 10px; }
  .sfuso input#sfuso { grid-column: 1 / -1; }
  .sfuso input#sfuso-qta { text-align: center; font-variant-numeric: tabular-nums; }
  @media (min-width: 520px) {
    .sfuso { grid-template-columns: 1fr 84px 130px auto; }
    .sfuso input#sfuso { grid-column: auto; }
  }

  /* ---------- filtri ---------- */

  .chips { display: flex; gap: 8px; overflow-x: auto; padding: 2px 0 10px; scrollbar-width: none; }
  .chips::-webkit-scrollbar { display: none; }
  .chip {
    flex: none; height: 34px; padding: 0 14px; border-radius: 999px;
    background: var(--card); color: var(--ink);
    font-size: 15px; font-weight: 500;
    display: flex; align-items: center; gap: 6px;
  }
  .chip[aria-pressed="true"] { background: var(--blu); color: #FFFFFF; font-weight: 600; }
  .chip[aria-pressed="true"]::before { background: #FFFFFF; }

  /* ---------- lista dei prodotti ---------- */

  .lista { display: flex; flex-direction: column; gap: 14px; }
  .riga { background: var(--card); border-radius: var(--raggio); overflow: hidden; transition: box-shadow 0.25s; }
  .riga.puntata { box-shadow: 0 0 0 3px var(--blu); }

  .testa { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; padding: 14px 16px 12px; }
  .testa > div:first-child { min-width: 0; flex: 1; }
  input.titolo {
    width: 100%; padding: 2px 6px; margin: -2px 0 0 -6px;
    border: none; border-radius: 8px; background: transparent;
    font-size: 17px; font-weight: 600; text-overflow: ellipsis;
  }
  input.titolo:focus { background: var(--fill); }
  input.titolo::placeholder { font-weight: 400; }
  .meta {
    font-size: 12px; color: var(--ink-2); font-variant-numeric: tabular-nums;
    margin-top: 2px; overflow-wrap: anywhere;
  }
  .meta .sep { opacity: 0.5; margin: 0 5px; }
  .etichette { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-top: 8px; }
  .etichette .luogo { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--ink-2); }
  .etichette .avviso {
    font-size: 12px; font-weight: 600; padding: 3px 9px; border-radius: 999px; white-space: nowrap;
    color: var(--arancio); background: var(--arancio-velo);
  }
  .riga.scaduto .etichette .avviso { color: var(--rosso); background: var(--rosso-velo); }

  .somma { font-size: 17px; font-weight: 600; font-variant-numeric: tabular-nums; text-align: right; white-space: nowrap; }
  .somma.zero { color: var(--arancio); }
  .somma small { display: block; font-size: 12px; font-weight: 400; color: var(--ink-2); }

  /* ogni comando è una riga di elenco: voce a sinistra, controllo a destra */
  .comando {
    position: relative; display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
    min-height: 48px; padding: 7px 16px;
  }
  .comando::before { content: ""; position: absolute; top: 0; left: 16px; right: 0; height: 1px; background: var(--sep); transform: scaleY(0.5); }
  .comando > .voce { flex: 1; min-width: 84px; font-size: 16px; }
  .comando > .voce small { display: block; font-size: 12px; color: var(--ink-2); }

  .resto, input.q, .comando input[type="date"], select.unita {
    height: 34px; border: none; border-radius: 8px;
    background: var(--fill); color: var(--ink); font-size: 16px;
    font-variant-numeric: tabular-nums;
  }
  .resto { width: 92px; padding: 0 10px; text-align: right; }
  input.q { width: 58px; padding: 0 8px; text-align: center; font-weight: 600; }
  .comando input[type="date"] { padding: 0 10px; min-width: 150px; }
  select.unita { padding: 0 8px; color: var(--blu); max-width: 130px; }

  .stepper { display: flex; background: var(--fill); border-radius: 8px; overflow: hidden; }
  .stepper button { width: 46px; height: 34px; font-size: 22px; font-weight: 400; line-height: 1; }
  .stepper button + button { border-left: 1px solid var(--sep); }

  button.frazione {
    min-width: 40px; height: 34px; padding: 0 8px; border-radius: 8px;
    background: var(--blu-velo); color: var(--blu); font-size: 16px; font-weight: 600;
  }

  .interruttore {
    position: relative; width: 51px; height: 31px; border-radius: 999px; flex: none;
    background: var(--fill-forte); transition: background 0.2s;
  }
  .interruttore::after {
    content: ""; position: absolute; top: 2px; left: 2px; width: 27px; height: 27px; border-radius: 50%;
    background: #FFFFFF; box-shadow: 0 2px 5px rgba(0, 0, 0, 0.25); transition: transform 0.2s;
  }
  .interruttore[aria-checked="true"] { background: var(--verde); }
  .interruttore[aria-checked="true"]::after { transform: translateX(20px); }
  .interruttore:active { opacity: 1; }
  @media (prefers-reduced-motion: reduce) { .interruttore, .interruttore::after, .riga { transition: none; } }

  .comando.via { justify-content: space-around; }
  .comando.via button { color: var(--rosso); font-size: 16px; min-height: 34px; padding: 0 12px; }
  .comando.via button.calmo { color: var(--blu); }
  .comando.via button.forte { color: var(--blu); font-weight: 600; }

  /* in uscita il mirino cambia colore: si vede subito in che modalità sei */
  .camera[data-modo="USCITA"] .mirino { border-color: #FF9F0A; }

  /* schede dei prodotti arrivati dallo scontrino */
  .comando .testo { font-size: 15px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
  .comando button.mini {
    height: 34px; padding: 0 12px; border-radius: 8px;
    background: var(--blu-velo); color: var(--blu); font-size: 15px; font-weight: 600;
  }
  .comando button.mini[aria-pressed="true"] { background: var(--blu); color: #FFFFFF; }
  .etichette .dubbio { font-size: 12px; font-weight: 600; padding: 3px 9px; border-radius: 999px; color: var(--arancio); background: var(--arancio-velo); }
  .etichette .gelo { font-size: 12px; font-weight: 600; padding: 3px 9px; border-radius: 999px; color: var(--blu); background: var(--blu-velo); }

  .vuoto { background: var(--card); border-radius: var(--raggio); padding: 18px 16px; }
  .vuoto p { margin: 0 0 10px; color: var(--ink-2); font-size: 15px; }
  .vuoto ol { margin: 0; padding-left: 22px; color: var(--ink-2); font-size: 15px; }
  .vuoto li { margin-bottom: 6px; }
  .vuoto li b { color: var(--ink); font-weight: 600; }

  /* ---------- azioni finali ---------- */

  .fine { display: flex; flex-direction: column; gap: 12px; }
  .elenco { background: var(--card); border-radius: var(--raggio); overflow: hidden; }
  .elenco button { display: block; width: 100%; min-height: 48px; padding: 0 16px; text-align: left; color: var(--blu); }
  .elenco button + button { border-top: 1px solid var(--sep); }
  .elenco button.pericolo { color: var(--rosso); }
</style>
</head>
<body>

<div class="wrap">
  <header>
    <h1>Dispensa</h1>
    <p class="sub" id="riepilogo">Nessun prodotto</p>
  </header>

  <section>
    <p class="label">Dove stai guardando</p>
    <div class="segmenti" id="chips"></div>
  </section>

  <section>
    <p class="label">Cosa stai facendo</p>
    <div class="segmenti" id="modo"></div>
    <p class="nota" id="modo-nota" style="margin-top: 7px"></p>
  </section>

  <section>
    <div class="camera off" id="camera">
      <video id="video" playsinline muted></video>
      <div class="mirino"></div>
      <div class="flash" id="flash"></div>
      <div class="camera-msg" id="camera-msg"><b>Fotocamera spenta</b>Accendila e avvicina il codice a barre finché non senti il segnale.</div>
    </div>
    <div class="azioni-camera">
      <button class="primary" id="btn-camera">Accendi la fotocamera</button>
      <button class="ghost" id="btn-foto">Da una foto</button>
      <input type="file" id="file-foto" accept="image/*">
    </div>
  </section>

  <section>
    <p class="label">Oppure scrivi il codice a mano</p>
    <div class="manuale">
      <input id="codice" inputmode="numeric" placeholder="Codice a barre" autocomplete="off" aria-label="codice a barre">
      <button class="ghost" id="btn-codice">Aggiungi</button>
    </div>
  </section>

  <section>
    <p class="label">Prodotti sfusi, senza codice</p>
    <div class="sfuso">
      <input id="sfuso" placeholder="Pomodori, pane, mele…" autocomplete="off" aria-label="nome del prodotto sfuso">
      <input id="sfuso-qta" inputmode="decimal" value="1" aria-label="quanto">
      <select id="sfuso-unita" aria-label="unità di misura">
        <option value="pz">pezzi</option>
        <option value="kg">kg</option>
        <option value="g">grammi</option>
        <option value="l">litri</option>
        <option value="ml">ml</option>
      </select>
      <button class="ghost" id="btn-sfuso">Aggiungi</button>
    </div>
  </section>

  <section id="sez-pendenti" style="display: none">
    <p class="label" id="pend-titolo">Dallo scontrino</p>
    <div id="pendenti"></div>
  </section>

  <section>
    <p class="label">In casa</p>
    <div class="chips" id="filtri"></div>
    <p class="nota allarme" id="allerta" style="margin-bottom: 10px"></p>
    <div id="contenuto"></div>
    <p class="nota" id="stato" style="margin-top: 12px" role="status"></p>
  </section>

  <section class="fine">
    <button class="primary" id="btn-csv">Scarica il file per Claude</button>
    <div class="elenco">
      <button id="btn-collega">Collega al foglio</button>
      <button id="btn-import">Riparti da un file</button>
      <button id="btn-svuota" class="pericolo">Svuota tutto</button>
    </div>
    <p class="nota" id="stato-foglio" role="status"></p>
    <input type="file" id="file-import" accept=".csv,text/csv">
  </section>
</div>

<script>
(function () {
  var LUOGHI = ["DISPENSA", "FRIGO", "FREEZER", "CANTINA"];
  function nomeLuogo(l) { return l.charAt(0) + l.slice(1).toLowerCase(); }
  var dove = "DISPENSA";
  var items = new Map();
  var editing = false;
  var puntato = "";      /* riga evidenziata dopo una scansione */
  var daMostrare = "";   /* riga da portare a schermo, una volta sola */
  var timerPunta = null;
  var reader = null;
  var stream = null;
  var acceso = false;
  var avvio = false;     /* la fotocamera si sta accendendo */
  var letture = 0;
  var motore = "";

  /* Collegamento al foglio Google, attraverso il workflow n8n WF_INVENTARIO_APP. */
  var API = "https://carlo-bucciante.app.n8n.cloud/webhook/inventario-app-9q4t2";
  var chiave = "";                                   /* parola d'ordine, resta solo su questo telefono */
  var coda = { completati: [], ignorati: [], movimenti: [] };  /* cose da dire al foglio, in attesa di rete */
  var lapidi = [];                                   /* prodotti tolti dalla lista: {id, ts} */
  var pendenti = [];                                 /* righe dello scontrino ancora da completare */
  var inAttesa = "";                                 /* riga dello scontrino che aspetta il suo codice a barre */
  var modo = "ENTRATA";
  var inSync = false, timerSync = null, daRisincronizzare = false;

  function leggiMemoria(nome, difetto) {
    try { var v = JSON.parse(localStorage.getItem(nome) || "null"); return v === null ? difetto : v; } catch (e) { return difetto; }
  }
  function scriviMemoria(nome, v) { try { localStorage.setItem(nome, JSON.stringify(v)); } catch (e) {} }
  function salvaCoda() { scriviMemoria("coda", coda); scriviMemoria("lapidi", lapidi); scriviMemoria("pendenti", pendenti); }

  /* Cosa mostra la lista: un solo luogo oppure tutto, e in che ordine. */
  var SOGLIA = 3; /* giorni entro cui un prodotto è "in scadenza" */
  var vista = "TUTTO";
  var perScadenza = false;
  try {
    vista = localStorage.getItem("vista") || "TUTTO";
    perScadenza = localStorage.getItem("ordine") === "scadenza";
  } catch (e) {}
  if (vista !== "TUTTO" && LUOGHI.indexOf(vista) < 0) { vista = "TUTTO"; }

  function $(id) { return document.getElementById(id); }
  var contenuto = $("contenuto"), stato = $("stato"), camera = $("camera"), msg = $("camera-msg");

  /* ---------- numeri ---------- */

  function numero(v, difetto) {
    var n = parseFloat(String(v).replace(",", "."));
    return isFinite(n) ? n : (difetto === undefined ? 0 : difetto);
  }

  function pulito(n) {
    return Math.round(n * 1000) / 1000;
  }

  function scritto(n) {
    return String(pulito(n)).replace(".", ",");
  }

  function pezzi(n) {
    return scritto(n) + (pulito(n) === 1 ? " pezzo" : " pezzi");
  }

  /* "1.000 g" e "1,000 ml" sono mille, non uno: con grammi e millilitri
     un separatore seguito da tre cifre è quello delle migliaia. */
  function cifra(testo, unita) {
    if (/^\d{1,3}[.,]\d{3}$/.test(testo) && /^(g|gr|ml)$/.test(unita)) {
      return parseFloat(testo.replace(/[.,]/, ""));
    }
    return parseFloat(testo.replace(",", "."));
  }

  /* Legge "500 g", "1,5 L", "6 x 125 g" e ne ricava numero + unità. */
  function leggiFormato(testo) {
    var t = String(testo || "").toLowerCase();
    var molt = t.match(/(\d+)\s*[x×]\s*(\d+(?:[.,]\d+)?)\s*(kg|gr|g|lt|l|ml|cl)\b/);
    if (molt) {
      return normalizza(parseFloat(molt[1]) * cifra(molt[2], molt[3]), molt[3]);
    }
    var uno = t.match(/(\d+(?:[.,]\d+)?)\s*(kg|gr|g|lt|l|ml|cl)\b/);
    if (uno) { return normalizza(cifra(uno[1], uno[2]), uno[2]); }
    return null;
  }

  function normalizza(q, u) {
    if (u === "gr") u = "g";
    if (u === "lt") u = "l";
    if (u === "cl") { q = q * 10; u = "ml"; }
    return { qta: q, unita: u };
  }

  /* La data di oggi secondo l'orologio del telefono (non quello di Greenwich). */
  function oggiLocale() {
    var d = new Date();
    var due = function (n) { return (n < 10 ? "0" : "") + n; };
    return d.getFullYear() + "-" + due(d.getMonth() + 1) + "-" + due(d.getDate());
  }

  /* Il nome di uno sfuso diventa la sua chiave: senza accenti, solo lettere e cifre. */
  function chiaveDa(nome) {
    var s = String(nome || "").toUpperCase();
    if (s.normalize) { s = s.normalize("NFD").replace(/[̀-ͯ]/g, ""); }
    return s.replace(/[^A-Z0-9]+/g, "_").replace(/^_+|_+$/g, "");
  }

  /* L'ultima cifra di un codice a barre è una cifra di controllo: se non torna, il codice è sbagliato. */
  function codiceValido(c) {
    if ([8, 12, 13, 14].indexOf(c.length) < 0) return false;
    var s = 0;
    for (var i = 0; i < c.length - 1; i++) {
      s += (+c.charAt(c.length - 2 - i)) * (i % 2 === 0 ? 3 : 1);
    }
    return (10 - (s % 10)) % 10 === +c.charAt(c.length - 1);
  }

  /* ---------- memoria ---------- */

  /* Le prime versioni tenevano l'unità in `unita` e il residuo dentro `aperta`. */
  function migra(it) {
    if (it.confUnita === undefined) { it.confUnita = it.unita || "pz"; }
    if (typeof it.aperta === "number") {
      it.residua = it.aperta;
      it.resUnita = it.unita || it.confUnita;
      it.aperta = it.aperta > 0;
    }
    if (it.aperta === undefined) { it.aperta = false; }
    if (it.residua === undefined) { it.residua = 0; }
    if (it.resUnita === undefined) { it.resUnita = it.confUnita; }
    it.chiuse = numero(it.chiuse, 0);
    it.confQta = numero(it.confQta, 0);
    if (!it.dove) { it.dove = "DISPENSA"; }
    delete it.unita;
    return it;
  }

  function carica() {
    try {
      var raw = JSON.parse(localStorage.getItem("dispensa") || "[]");
      if (!Array.isArray(raw)) return;
      raw.forEach(function (it) {
        /* una voce rovinata non deve far perdere le altre */
        if (it && typeof it === "object" && it.id) { items.set(String(it.id), migra(it)); }
      });
    } catch (e) {}
  }

  function salva(senzaInvio) {
    var riuscito = true;
    try { localStorage.setItem("dispensa", JSON.stringify(Array.from(items.values()))); }
    catch (e) { riuscito = false; }
    render();
    if (!senzaInvio) { programmaSync(); }
    if (!riuscito) {
      nota("Attenzione: il telefono non mi lascia salvare la lista. Scarica subito il file, altrimenti chiudendo la pagina la perdi.", true);
    }
  }

  /* Rubrica dei formati scritti a mano: barcode → quanto contiene una confezione.
     Serve per i prodotti che il catalogo non conosce, così li dichiari una volta sola. */
  var rubrica = {};

  function caricaRubrica() {
    try { rubrica = JSON.parse(localStorage.getItem("formati") || "{}") || {}; } catch (e) { rubrica = {}; }
  }

  function ricorda(barcode, qta, unita) {
    if (!barcode || !(qta > 0)) return;
    rubrica[barcode] = { qta: qta, unita: unita };
    try { localStorage.setItem("formati", JSON.stringify(rubrica)); } catch (e) {}
  }

  /* ---------- conti ---------- */

  var UNITA = [["pz", "pezzi"], ["g", "grammi"], ["kg", "kg"], ["ml", "ml"], ["l", "litri"]];
  var PESO = { g: 1, kg: 1000 };
  var VOLUME = { ml: 1, l: 1000 };

  function famiglia(u) {
    if (PESO[u]) return "peso";
    if (VOLUME[u]) return "volume";
    return "pezzi";
  }

  function unitaBuona(v, difetto) {
    v = String(v || "").toLowerCase();
    return (v === "pz" || PESO[v] || VOLUME[v]) ? v : difetto;
  }

  /* Porta una quantità da un'unità all'altra, se sono parenti (g↔kg, ml↔l). */
  function converti(q, da, a) {
    if (da === a) return q;
    var f = famiglia(da);
    if (f !== famiglia(a)) return null;
    if (f === "pezzi") return q;
    var tab = (f === "peso") ? PESO : VOLUME;
    return q * tab[da] / tab[a];
  }

  /* Quanto ce n'è in tutto: le confezioni intere più quel che resta in quella aperta.
     `certo` è falso quando le due parti non si possono sommare (formato non dichiarato,
     oppure residuo in un'unità che non è parente del formato: grammi con pezzi). */
  function totale(it) {
    var u = it.confUnita || "pz";
    var chiuse = numero(it.chiuse, 0);
    var res = it.aperta ? numero(it.residua, 0) : 0;
    var ru = it.resUnita || u;
    var base, baseCerta = true;
    if (it.confQta > 0) { base = chiuse * it.confQta; }       /* 2 confezioni da 500 g, 2 da 6 uova */
    else if (u === "pz") { base = chiuse; }                   /* contato a pezzi */
    else { base = 0; baseCerta = (chiuse === 0); }            /* a peso, formato non dichiarato */
    var conv = res > 0 ? converti(res, ru, u) : 0;
    if (baseCerta && conv !== null) { return { qta: pulito(base + conv), unita: u, certo: true }; }
    if (baseCerta && base === 0) { return { qta: pulito(res), unita: ru, certo: true }; }
    return { qta: pulito(chiuse + res), unita: u, certo: false };
  }

  function totaleScritto(it) {
    var t = totale(it);
    if (t.certo) { return t.unita === "pz" ? pezzi(t.qta) : scritto(t.qta) + " " + t.unita; }
    var u = it.confUnita || "pz";
    var chiuse = numero(it.chiuse, 0);
    var voci = [];
    if (chiuse > 0) {
      if (it.confQta > 0) { voci.push(u === "pz" ? pezzi(chiuse * it.confQta) : scritto(chiuse * it.confQta) + " " + u); }
      else if (u === "pz") { voci.push(pezzi(chiuse)); }
      else { voci.push(scritto(chiuse) + " conf."); }
    }
    if (it.aperta && numero(it.residua, 0) > 0) {
      var ru = it.resUnita || u;
      voci.push(ru === "pz" ? pezzi(numero(it.residua, 0)) : scritto(numero(it.residua, 0)) + " " + ru);
    }
    return voci.length ? voci.join(" + ") : "0";
  }

  /* ---------- interfaccia ---------- */

  function nota(testo, allarme) {
    stato.textContent = testo || "";
    stato.className = allarme ? "nota allarme" : "nota";
  }

  function chips() {
    var box = $("chips");
    box.innerHTML = "";
    LUOGHI.forEach(function (l) {
      var b = document.createElement("button");
      b.className = "seg";
      b.type = "button";
      b.textContent = nomeLuogo(l);
      b.setAttribute("data-luogo", l);
      b.setAttribute("aria-pressed", String(l === dove));
      b.onclick = function () { dove = l; chips(); };
      box.appendChild(b);
    });
  }

  function ordinati() {
    return Array.from(items.values()).sort(function (a, b) { return (b.ts || 0) - (a.ts || 0); });
  }

  /* Giorni che mancano alla scadenza: negativo = già scaduto, null = data non scritta. */
  function giorni(it) {
    var p = String(it.scadenza || "").split("-");
    if (p.length !== 3) return null;
    var d = new Date(+p[0], p[1] - 1, +p[2]);
    var oggi = new Date();
    oggi.setHours(0, 0, 0, 0);
    var n = Math.round((d - oggi) / 86400000);
    return isFinite(n) ? n : null;
  }

  function avviso(g) {
    if (g === null || g > SOGLIA) return "";
    if (g < -1) return "Scaduto da " + (-g) + " giorni";
    if (g === -1) return "Scaduto ieri";
    if (g === 0) return "Scade oggi";
    if (g === 1) return "Scade domani";
    return "Scade tra " + g + " giorni";
  }

  /* I prodotti del luogo scelto; con "prima ciò che scade" quelli senza data vanno in fondo. */
  function visibili() {
    var l = ordinati().filter(function (it) { return vista === "TUTTO" || it.dove === vista; });
    if (perScadenza) {
      l.sort(function (a, b) {
        var ga = giorni(a), gb = giorni(b);
        if (ga === null && gb === null) return 0;
        if (ga === null) return 1;
        if (gb === null) return -1;
        return ga - gb;
      });
    }
    return l;
  }

  function ricordaVista() {
    try {
      localStorage.setItem("vista", vista);
      localStorage.setItem("ordine", perScadenza ? "scadenza" : "recenti");
    } catch (e) {}
  }

  function filtri(tutti) {
    var box = $("filtri");
    box.innerHTML = "";
    if (!tutti.length) return;
    ["TUTTO"].concat(LUOGHI).forEach(function (l) {
      var quanti = l === "TUTTO" ? tutti.length
        : tutti.filter(function (it) { return it.dove === l; }).length;
      var b = document.createElement("button");
      b.className = "chip";
      b.type = "button";
      b.textContent = (l === "TUTTO" ? "Tutto" : nomeLuogo(l)) + " " + quanti;
      if (l !== "TUTTO") { b.setAttribute("data-luogo", l); }
      b.setAttribute("aria-pressed", String(l === vista));
      b.onclick = function () { vista = l; ricordaVista(); render(); };
      box.appendChild(b);
    });
    var o = document.createElement("button");
    o.className = "chip";
    o.type = "button";
    o.textContent = "Prima ciò che scade";
    o.setAttribute("aria-pressed", String(perScadenza));
    o.onclick = function () { perScadenza = !perScadenza; ricordaVista(); render(); };
    box.appendChild(o);
  }

  /* Mentre un dito è appoggiato sulla lista non la ridisegno: altrimenti il pulsante
     che stai toccando verrebbe sostituito sotto il dito e il tocco andrebbe perso.
     Il ridisegno resta in sospeso e parte appena il tocco è concluso. */
  var premendo = false, sospeso = false, timerPremi = null;

  function rilascia() {
    clearTimeout(timerPremi);
    premendo = false;
    if (sospeso) { render(); }
  }

  [contenuto, $("pendenti")].forEach(function (zona) {
    zona.addEventListener("pointerdown", function () { premendo = true; clearTimeout(timerPremi); }, true);
  });
  ["pointerup", "pointercancel"].forEach(function (tipo) {
    document.addEventListener(tipo, function () {
      if (premendo) { clearTimeout(timerPremi); timerPremi = setTimeout(rilascia, 400); }
    }, true);
  });
  document.addEventListener("click", function () { if (premendo) { rilascia(); } });

  function finito() {
    editing = false;
    if (sospeso && !premendo) { render(); }
  }

  function render() {
    if (editing || premendo) { sospeso = true; return; }
    sospeso = false;
    renderPendenti();
    var lista = ordinati();
    filtri(lista);
    $("allerta").textContent = "";
    var finiti = lista.filter(function (it) { return totale(it).qta <= 0; }).length;
    $("riepilogo").textContent = lista.length === 0 ? "Nessun prodotto"
      : lista.length + (lista.length === 1 ? " prodotto" : " prodotti") +
        (finiti > 0 ? " · " + finiti + (finiti === 1 ? " finito" : " finiti") : "");

    if (lista.length === 0) {
      contenuto.innerHTML = '<div class="vuoto"><p>Qui compare quello che hai in casa, con quanto ne resta.</p>' +
        "<ol><li>Scegli <b>dove</b> stai guardando: dispensa, frigo, freezer o cantina.</li>" +
        "<li>Passa i codici a barre davanti alla fotocamera: ogni prodotto entra con <b>una confezione chiusa</b>.</li>" +
        "<li>Se una confezione è <b>aperta</b>, dichiara quanto ne resta: metà, tre quarti, o il peso esatto.</li>" +
        "<li>Quello che non ha codice — pomodori, pane, mele — lo scrivi a peso qui sopra.</li></ol></div>";
      return;
    }

    lista = visibili();
    var scaduti = 0, presto = 0;
    lista.forEach(function (it) {
      var g = giorni(it);
      if (g === null) return;
      if (g < 0) { scaduti++; } else if (g <= SOGLIA) { presto++; }
    });
    var allarmi = [];
    if (scaduti) { allarmi.push(scaduti + (scaduti === 1 ? " scaduto" : " scaduti")); }
    if (presto) { allarmi.push(presto + " in scadenza entro " + SOGLIA + " giorni"); }
    $("allerta").textContent = allarmi.join(" · ");

    if (lista.length === 0) {
      contenuto.innerHTML = '<div class="vuoto"><p style="margin:0">Qui non c\'è ancora niente: tocca «Tutto» per vedere gli altri luoghi.</p></div>';
      return;
    }

    var el = document.createElement("div");
    el.className = "lista";
    lista.forEach(function (it) { el.appendChild(riga(it)); });
    contenuto.innerHTML = "";
    contenuto.appendChild(el);

    /* porto a schermo la riga appena letta, ma una volta sola: poi la pagina resta ferma */
    if (daMostrare) {
      var bersaglio = document.getElementById("r-" + daMostrare);
      daMostrare = "";
      if (bersaglio && bersaglio.scrollIntoView) { bersaglio.scrollIntoView({ block: "center", behavior: "smooth" }); }
    }
  }

  function evidenzia(id) {
    puntato = id;
    daMostrare = id;
    clearTimeout(timerPunta);
    timerPunta = setTimeout(function () {
      /* tolgo solo il bordo: ridisegnare tutto chiuderebbe una tendina aperta */
      var e = document.getElementById("r-" + puntato);
      if (e) { e.classList.remove("puntata"); }
      puntato = "";
    }, 4000);
  }

  function comando(etichetta, sotto) {
    var box = document.createElement("div");
    box.className = "comando";
    var lab = document.createElement("span");
    lab.className = "voce";
    lab.textContent = etichetta;
    if (sotto) {
      var s = document.createElement("small");
      s.textContent = sotto;
      lab.appendChild(s);
    }
    box.appendChild(lab);
    return box;
  }

  function riga(it) {
    var t = totale(it);
    var u = it.confUnita || "pz";
    var r = document.createElement("div");
    var gg = giorni(it);
    r.className = "riga" + (gg !== null && gg < 0 ? " scaduto" : (gg !== null && gg <= SOGLIA ? " scade" : "")) +
      (puntato === it.id ? " puntata" : "");
    r.id = "r-" + it.id;
    r.setAttribute("data-luogo", it.dove);

    /* intestazione: nome, dati, totale */
    var testa = document.createElement("div");
    testa.className = "testa";

    var sx = document.createElement("div");
    var nome = document.createElement("input");
    nome.className = "titolo";
    nome.value = it.prodotto || "";
    nome.placeholder = it.stato === "cerco" ? "Cerco il prodotto…"
      : it.stato === "rete" ? "Catalogo non raggiunto: scrivi il nome"
      : "Scrivi qui il nome";
    nome.setAttribute("aria-label", "nome del prodotto");
    nome.onfocus = function () { editing = true; };
    nome.onblur = finito;
    nome.onchange = function () {
      it.prodotto = nome.value.trim();
      it.ts = Date.now();
      editing = false;
      salva();
    };
    sx.appendChild(nome);

    var meta = document.createElement("div");
    meta.className = "meta";
    var voci = [];
    if (it.barcode) voci.push(it.barcode);
    if (it.marca) voci.push(it.marca);
    if (it.formato && /[a-z]/i.test(it.formato)) voci.push(it.formato);
    meta.innerHTML = voci.map(function (v) { return String(v).replace(/[<>&]/g, ""); }).join('<span class="sep">·</span>');
    sx.appendChild(meta);

    var etichette = document.createElement("div");
    etichette.className = "etichette";
    var targa = document.createElement("span");
    targa.className = "luogo";
    targa.textContent = nomeLuogo(it.dove);
    etichette.appendChild(targa);
    if (avviso(gg)) {
      var allarme = document.createElement("span");
      allarme.className = "avviso";
      allarme.textContent = avviso(gg);
      etichette.appendChild(allarme);
    }
    if (it.congelatoIl) {
      var gelo = document.createElement("span");
      gelo.className = "gelo";
      gelo.textContent = "Congelato il " + dataBreve(it.congelatoIl);
      etichette.appendChild(gelo);
    }
    sx.appendChild(etichette);

    var somma = document.createElement("div");
    somma.className = "somma" + (t.qta <= 0 ? " zero" : "");
    var forte = document.createElement("span");
    forte.textContent = t.qta <= 0 ? "Finito" : totaleScritto(it);
    var sotto = document.createElement("small");
    sotto.textContent = t.qta <= 0 ? "da ricomprare" : "in casa";
    somma.appendChild(forte);
    somma.appendChild(sotto);

    testa.appendChild(sx);
    testa.appendChild(somma);
    r.appendChild(testa);

    /* costruisce una casella numerica con la sua unità di misura */
    function misura(etichetta, valore, unita, segnaposto, quandoCambia) {
      var box = comando(etichetta);
      var num = document.createElement("input");
      num.className = "resto";
      num.inputMode = "decimal";
      num.value = valore > 0 ? scritto(valore) : "";
      num.placeholder = segnaposto;
      num.setAttribute("aria-label", etichetta);
      var sel = document.createElement("select");
      sel.className = "unita";
      sel.setAttribute("aria-label", "unità di misura, " + etichetta);
      UNITA.forEach(function (voce) {
        var o = document.createElement("option");
        o.value = voce[0];
        o.textContent = voce[1];
        if (voce[0] === unita) { o.selected = true; }
        sel.appendChild(o);
      });
      var manda = function () {
        editing = false;
        quandoCambia(Math.max(0, numero(num.value, 0)), sel.value);
      };
      num.onfocus = function () { editing = true; };
      num.onblur = finito;
      num.onchange = manda;
      sel.onchange = manda;
      box.appendChild(num);
      box.appendChild(sel);
      return box;
    }

    /* formato della confezione: lo propone il catalogo, lo corregge Carlo */
    r.appendChild(misura("Formato", it.confQta, u, "quanto",
      function (q, nuova) {
        var prima = it.confUnita || "pz";
        it.confQta = q;
        it.confUnita = nuova;
        ricorda(it.barcode, q, nuova);
        var conResiduo = it.aperta && numero(it.residua, 0) > 0;
        if (!conResiduo) {
          it.resUnita = nuova;
        } else if (famiglia(prima) !== famiglia(nuova) && famiglia(it.resUnita || prima) !== famiglia(nuova)) {
          /* da grammi a pezzi (o viceversa): il vecchio residuo non vuol dire più niente */
          it.residua = q > 0 ? pulito(q / 2) : 0;
          it.resUnita = nuova;
          nota("Hai cambiato tipo di formato: ricontrolla quanto resta nella confezione aperta.", true);
        }
        it.ts = Date.now();
        salva();
      }));

    /* quante confezioni intere */
    var aConfezioni = it.confQta > 0 || u !== "pz";
    var c = comando(aConfezioni ? "Confezioni chiuse" : "Pezzi interi",
      it.confQta > 0 ? "da " + (u === "pz" ? pezzi(it.confQta) : scritto(it.confQta) + " " + u) : "");
    var q = document.createElement("input");
    q.className = "q";
    q.inputMode = "decimal";
    q.value = scritto(numero(it.chiuse, 0));
    q.setAttribute("aria-label", aConfezioni ? "confezioni chiuse" : "pezzi interi");
    q.onfocus = function () { editing = true; q.select(); };
    q.onblur = finito;
    q.onchange = function () {
      editing = false;
      it.chiuse = pulito(Math.max(0, numero(q.value, 0)));
      it.ts = Date.now();
      salva();
    };
    var st = document.createElement("div");
    st.className = "stepper";
    var meno = document.createElement("button");
    meno.type = "button";
    meno.textContent = "−";
    meno.setAttribute("aria-label", "una in meno");
    meno.onclick = function () { it.chiuse = pulito(Math.max(0, numero(it.chiuse, 0) - 1)); it.ts = Date.now(); salva(); };
    var piu = document.createElement("button");
    piu.type = "button";
    piu.textContent = "+";
    piu.setAttribute("aria-label", "una in più");
    piu.onclick = function () { it.chiuse = pulito(numero(it.chiuse, 0) + 1); it.ts = Date.now(); salva(); };
    st.appendChild(meno);
    st.appendChild(piu);
    c.appendChild(q);
    c.appendChild(st);
    r.appendChild(c);

    /* confezione aperta: interruttore, più le frazioni rapide */
    var ap = comando("Aperta");
    if (it.aperta && it.confQta > 0) {
      [["¼", 0.25], ["½", 0.5], ["¾", 0.75]].forEach(function (coppia) {
        var b = document.createElement("button");
        b.type = "button";
        b.className = "frazione";
        b.textContent = coppia[0];
        b.setAttribute("aria-label", "resta " + coppia[0] + " della confezione");
        b.onclick = function () {
          it.residua = pulito(it.confQta * coppia[1]);
          it.resUnita = it.confUnita;
          it.ts = Date.now();
          salva();
        };
        ap.appendChild(b);
      });
    }
    var leva = document.createElement("button");
    leva.type = "button";
    leva.className = "interruttore";
    leva.setAttribute("role", "switch");
    leva.setAttribute("aria-checked", String(!!it.aperta));
    leva.setAttribute("aria-label", "confezione aperta");
    leva.onclick = function () {
      var messaggio = "";
      if (!it.aperta) {
        it.aperta = true;
        /* quella aperta è una di quelle che avevo contato come chiuse: non va contata due volte */
        if (numero(it.chiuse, 0) >= 1) {
          it.chiuse = pulito(it.chiuse - 1);
          messaggio = "Ho tolto una confezione dalle chiuse: quella aperta la conto a parte.";
        }
        if (!numero(it.residua, 0)) {
          if (it.confQta > 0) { it.residua = pulito(it.confQta / 2); it.resUnita = it.confUnita; }
          else if (u === "pz") { it.residua = 0.5; it.resUnita = "pz"; }
        }
      } else {
        it.aperta = false;
        messaggio = "Confezione aperta tolta dal conto: se era ancora intera, aggiungila alle chiuse.";
      }
      it.ts = Date.now();
      salva();
      nota(messaggio);
    };
    ap.appendChild(leva);
    r.appendChild(ap);

    /* quantità residua nella confezione aperta */
    if (it.aperta) {
      r.appendChild(misura("Ne resta", numero(it.residua, 0), it.resUnita || u, "quanto",
        function (q2, u2) {
          var messaggio = "";
          if (it.confQta > 0) {
            var inFormato = converti(q2, u2, it.confUnita);
            if (inFormato !== null && inFormato > it.confQta) {
              q2 = pulito(converti(it.confQta, it.confUnita, u2));
              messaggio = "Nella confezione aperta non può restare più del formato: ho scritto " +
                scritto(q2) + " " + u2 + ".";
            }
          }
          it.residua = q2;
          it.resUnita = u2;
          it.ts = Date.now();
          salva();
          nota(messaggio, !!messaggio);
        }));
    }

    /* scadenza */
    var sc = comando("Scade il", it.scadenzaStimata && it.scadenza ? "data stimata: controlla la confezione" : "");
    sc.firstChild.id = "l-" + it.id;
    var data = document.createElement("input");
    data.type = "date";
    data.setAttribute("aria-labelledby", "l-" + it.id);

  /* ---------- OpenFoodFacts ---------- */

  var inCorso = new Set();

  function cerca(it) {
    if (inCorso.has(it)) return;

    fetch(url, { headers: { "Accept": "application/json" } })
      .then(function (r) { return r.json(); })
      .then(function (d) {
        /* una risposta senza `status` non viene dal catalogo: la tratto come rete assente */
        if (!d || d.status === undefined) { throw new Error("risposta non valida"); }
        inCorso.delete(it);
        if (items.get(it.id) !== it) return; /* nel frattempo è stato tolto dalla lista */
        var p = (d.status === 1 && d.product) ? d.product : null;
        if (!p) {
          it.stato = "ignoto";
          salva();
          nota("Il codice " + it.barcode + " non è in catalogo: scrivi tu il nome sulla sua riga, il resto resta buono.");
          return;

        var n = p.nutriments || {};
        /* il nome che hai scritto tu vale più di quello del catalogo */
        if (!it.prodotto) { it.prodotto = (p.product_name_it || p.product_name || "").trim(); }
        it.marca = (p.brands || "").split(",")[0].trim();
        it.formato = (p.quantity || "").trim();

        /* il formato: prima il campo numerico del catalogo, poi il testo libero */
        var qta = parseFloat(p.product_quantity);
        var um = String(p.product_quantity_unit || "").toLowerCase();
        if (it.confQta > 0) {
          /* formato già noto (l'hai scritto tu una volta): il catalogo non lo tocca */

        it.carboidrati = n.carbohydrates_100g;
        it.grassi = n.fat_100g;
        it.stato = "ok";
        it.ts = Date.now();
        salva();
      })

        g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + quando + 0.12);
        o.connect(g);
        g.connect(ctx.destination);
        o.start(ctx.currentTime + quando);
        o.stop(ctx.currentTime + quando + 0.13);
      };
      suona(0, doppio ? 820 : 1180);

      setTimeout(function () { ctx.close(); }, 700);

  /* ---------- fotocamera ---------- */

  var ultimo = { cod: "", t: 0 };

    /* un codice a 12 o 13 cifre con la cifra di controllo sbagliata è una lettura storta: la scarto */
    if ((cod.length === 12 || cod.length === 13) && !codiceValido(cod)) return;
    var ora = Date.now();
    if (cod === ultimo.cod && ora - ultimo.t < 3000) return;
    ultimo = { cod: cod, t: ora };
    letture++;
    ricevi(cod);
  }

  /* Un codice letto o scritto a mano: può servire a una riga dello scontrino, oppure è un'entrata/uscita. */
  function ricevi(cod) {

    if (aspetta) { assegnaCodice(aspetta, cod); beep(false); lampeggia(); return; }

      /* se questo prodotto è tra quelli dello scontrino, lo completi lì: altrimenti lo conterei due volte */

      if (noto) {

        nota("Questo prodotto è nello scontrino da completare: conferma quantità e scadenza nella sua scheda e tocca Registra.");

  }

  function fermaFlusso() {

  }

  function spegni() {
    acceso = false;

  function errore(e) {
    acceso = false;

    camera.className = "camera off";
    var nome = (e && e.name) ? e.name : "nessun errore";
    var testo = (e && e.message) ? e.message : "getUserMedia non esiste su questo browser";
    var causa = (nome === "NotAllowedError")
      ? "Il permesso della fotocamera è stato negato: toccando di nuovo il pulsante il browser te lo richiede. Se non lo chiede più, riattivalo dalle impostazioni del sito."
      : (nome === "NotFoundError" || nome === "OverconstrainedError")
        ? "Non trovo nessuna fotocamera su questo dispositivo. Scrivi i codici a mano qui sotto."
        : "Questo dispositivo non mi lascia usare la fotocamera. Scrivi i codici a mano qui sotto: funziona uguale, solo più lento.";
    msg.innerHTML = "<b>Fotocamera non disponibile</b>" + causa + '<span class="tecnico"></span>';
    msg.querySelector(".tecnico").textContent = nome + ": " + testo;

  function accendi() {
    var video = $("video");

    avvio = true;
    var chiesto = {
      video: {
        facingMode: { ideal: "environment" },

        height: { ideal: 1080 }

      stream = s;
      video.srcObject = s;

    }).then(function () {

      camera.className = "camera on";
      msg.style.display = "none";
      acceso = true;
      letture = 0;
      $("btn-camera").textContent = "Spegni la fotocamera";

      var traccia = stream.getVideoTracks()[0];
      var reale = traccia && traccia.getSettings ? traccia.getSettings() : {};
      var qualita = (reale.width && reale.height) ? reale.width + "×" + reale.height : "risoluzione ignota";

        if (avanzate.length) { traccia.applyConstraints({ advanced: avanzate }); }
      } catch (e) {}

      if (det) {
        motore = "lettore di Chrome";

  var COLONNE = ["BARCODE", "PRODOTTO", "MARCA", "CATEGORIA", "DOVE",

  /* Legge un CSV con punto e virgola e virgolette. */
  function leggiCsv(testo) {
    var righe = [], riga = [], cella = "", dentro = false;
    testo = testo.replace(/^﻿/, "");
    for (var i = 0; i < testo.length; i++) {
      var c = testo[i];
      if (dentro) {
        if (c === '"') {
          if (testo[i + 1] === '"') { cella += '"'; i++; } else { dentro = false; }
        } else { cella += c; }
      } else if (c === '"') { dentro = true; }
      else if (c === ";") { riga.push(cella); cella = ""; }
      else if (c === "\n") { riga.push(cella); righe.push(riga); riga = []; cella = ""; }
      else if (c !== "\r") { cella += c; }
    }
    if (cella !== "" || riga.length) { riga.push(cella); righe.push(riga); }
    return righe;

  /* ---------- date ---------- */

  function isoLocale(d) {

  /* Annota un movimento per lo storico del foglio. */

      dove: it.dove, quantita: pulito(numero(quantita, 0)), unita: unita || "", origine: origine || "APP", nota: testo || ""

  function nuovoProdotto(id, barcode, prodotto, luogo) {

      confQta: 0, confUnita: "pz", chiuse: 0, aperta: false, residua: 0, resUnita: "pz",
      scadenza: "", kcal: "", proteine: "", carboidrati: "", grassi: "", stato: barcode ? "ok" : "manuale", ts: Date.now()

  /* Aggiunge una quantità a un prodotto sfuso: a pezzi tra gli interi, a peso nel residuo. */
  function sommaSfuso(it, q, u) {

  /* Uscita: tolgo una confezione (prima quella aperta), o la quantità scritta per uno sfuso. */
  function esci(chiaveProdotto, barcode, nome, q, u) {
    var candidati = [];
    items.forEach(function (it) {
      if (it.id.slice(it.dove.length + 1) === chiaveProdotto && totale(it).qta > 0) { candidati.push(it); }
    });
    candidati.sort(function (a, b) { return (b.dove === dove ? 1 : 0) - (a.dove === dove ? 1 : 0); });
    var it = candidati[0];
    if (!it) {
      nota((nome || "Il codice " + barcode) + " non risulta in casa: niente da togliere. Se è una cosa nuova, passa su Entrata.", true);
      beep(true);
      lampeggia();

  }

  /* Sposta un prodotto da un luogo all'altro: tutto, o solo alcune confezioni.

      var risposta = prompt("Quante confezioni chiuse sposti in " + nomeLuogo(nuovo).toLowerCase() + "? Ne hai " + scritto(chiuse) + "." +
        (it.aperta ? " Se le sposti tutte, porto di là anche quella aperta." : ""), scritto(chiuse));
      if (risposta === null) { tendina.value = vecchio; return; }
      quante = Math.min(chiuse, Math.max(0, numero(risposta, chiuse)));
      if (!(quante > 0)) { tendina.value = vecchio; return; }

    }

  function renderPendenti() {

  function schedaPendente(p) {
    var m = bozza(p);
    var r = document.createElement("div");
    r.className = "riga" + (inAttesa === p.idRiga ? " puntata" : "");
    r.id = "p-" + p.idRiga;
    var cambia = function (fn) { return function () { editing = false; fn(this); salvaCoda(); }; };
    var campo = function (el) { el.onfocus = function () { editing = true; }; el.onblur = finito; return el; };

    var testa = document.createElement("div");
    testa.className = "testa";
    var sx = document.createElement("div");
    var nome = campo(document.createElement("input"));
    nome.className = "titolo";
    nome.value = m.prodotto || "";
    nome.placeholder = p.descrizione;
    nome.setAttribute("aria-label", "nome del prodotto");
    nome.onchange = cambia(function (e) { m.prodotto = e.value.trim(); });
    sx.appendChild(nome);
    var meta = document.createElement("div");
    meta.className = "meta";
    meta.textContent = [p.descrizione, p.negozio, dataBreve(p.dataAcquisto), p.prezzo !== "" ? scritto(numero(p.prezzo, 0)) + " €" : ""].filter(Boolean).join(" · ");
    sx.appendChild(meta);
    if (p.dubbio) {
      var et = document.createElement("div");
      et.className = "etichette";
      var d = document.createElement("span");
      d.className = "dubbio";
      d.textContent = "Non so se è un alimento";
      et.appendChild(d);
      sx.appendChild(et);
    }
    testa.appendChild(sx);
    r.appendChild(testa);

    /* codice a barre: da scansionare, già noto, oppure prodotto senza codice */
    var cb = comando("Codice a barre");
    var bottone = function (testo, premuto, azione) {
      var b = document.createElement("button");
      b.type = "button";
      b.className = "mini";
      b.textContent = testo;
      if (premuto !== null) { b.setAttribute("aria-pressed", String(premuto)); }
      b.onclick = azione;
      return b;
    };
    if (m.tipo === "CODICE" && m.barcode) {
      var cifre = document.createElement("span");
      cifre.className = "testo";
      cifre.textContent = m.barcode;
      cb.appendChild(cifre);
      cb.appendChild(bottone("Cambia", null, function () { m.barcode = ""; m.tipo = ""; salvaCoda(); render(); }));
    } else {
      cb.appendChild(bottone(inAttesa === p.idRiga ? "Ti ascolto…" : "Scansiona", inAttesa === p.idRiga, function () {
        inAttesa = inAttesa === p.idRiga ? "" : p.idRiga;
        if (m.tipo === "SFUSO") { m.tipo = ""; m.unita = "conf"; salvaCoda(); }
        render();
        if (inAttesa) {
          nota("Passa davanti alla fotocamera il codice di «" + p.descrizione + "», oppure scrivilo a mano qui sopra.");
          if (!acceso) { accendi(); }
          if (camera.scrollIntoView) { camera.scrollIntoView({ block: "center", behavior: "smooth" }); }
        }
      }));
      cb.appendChild(bottone("Senza codice", m.tipo === "SFUSO", function () {
        if (inAttesa === p.idRiga) { inAttesa = ""; }
        m.tipo = m.tipo === "SFUSO" ? "" : "SFUSO";
        if (m.tipo === "SFUSO" && m.unita === "conf") { m.unita = "pz"; }
        if (m.tipo !== "SFUSO") { m.unita = "conf"; }
        salvaCoda();
        render();
      }));
    }
    r.appendChild(cb);

    var tendina = function (voci, scelto, etichetta) {
      var s = document.createElement("select");
      s.className = "unita";
      s.setAttribute("aria-label", etichetta);
      voci.forEach(function (v) {
        var o = document.createElement("option");
        o.value = v[0];
        o.textContent = v[1];
        if (v[0] === scelto) { o.selected = true; }
        s.appendChild(o);
      });
      return s;
    };
    var numeroIn = function (valore, etichetta) {
      var n = campo(document.createElement("input"));
      n.className = "resto";
      n.inputMode = "decimal";
      n.value = valore > 0 ? scritto(valore) : "";
      n.placeholder = "quanto";
      n.setAttribute("aria-label", etichetta);
      return n;
    };

    if (m.tipo === "CODICE") {
      var fo = comando("Formato", "quanto contiene una confezione");
      var fq = numeroIn(m.formatoQta, "formato");
      fq.onchange = cambia(function (e) { m.formatoQta = Math.max(0, numero(e.value, 0)); });
      var fu = tendina(UNITA, m.formatoUnita, "unità del formato");
      fu.onchange = cambia(function (e) { m.formatoUnita = e.value; });
      fo.appendChild(fq);
      fo.appendChild(fu);
      r.appendChild(fo);
    }

    var qt = comando("Quantità");
    var qq = numeroIn(m.quantita, "quantità");
    qq.onchange = cambia(function (e) { m.quantita = Math.max(0, numero(e.value, 0)); });
    qt.appendChild(qq);
    if (m.tipo === "SFUSO") {
      var qu = tendina(UNITA, m.unita, "unità della quantità");
      qu.onchange = cambia(function (e) { m.unita = e.value; });
      qt.appendChild(qu);
    } else {
      var conf = document.createElement("span");
      conf.className = "testo";
      conf.textContent = "confezioni";
      qt.appendChild(conf);
    }
    r.appendChild(qt);

    var dv = comando("Dove lo metti");
    var dl = tendina(LUOGHI.map(function (l) { return [l, nomeLuogo(l)]; }), m.dove || dove, "dove lo metti");
    dl.onchange = cambia(function (e) { m.dove = e.value; });
    dv.appendChild(dl);
    r.appendChild(dv);

    var sc = comando("Scade il", m.stimata && m.scadenza ? "proposta dalla volta scorsa: controlla" : "");
    var data = campo(document.createElement("input"));
    data.type = "date";
    data.setAttribute("aria-label", "scadenza");
    data.value = m.scadenza || "";
    data.onchange = cambia(function (e) { m.scadenza = e.value; m.stimata = false; });
    sc.appendChild(data);
    r.appendChild(sc);

    var rapide = comando("");
    rapide.firstChild.style.display = "none";
    [["+3 giorni", 3], ["+1 settimana", 7], ["+1 mese", 30], ["Nessuna", 0]].forEach(function (c) {
      rapide.appendChild(bottone(c[0], null, function () {
        m.scadenza = c[1] ? giornoDa("", c[1]) : "";
        m.stimata = false;
        salvaCoda();
        render();
      }));
    });
    r.appendChild(rapide);

    var fondo = document.createElement("div");
    fondo.className = "comando via";
    var no = document.createElement("button");
    no.type = "button";
    no.textContent = "Non è un alimento";
    no.onclick = function () { scarta(p); };
    var si = document.createElement("button");
    si.type = "button";
    si.className = "forte";
    si.textContent = "Registra";
    si.onclick = function () { registra(p); };
    fondo.appendChild(no);
    fondo.appendChild(si);
    r.appendChild(fondo);
    return r;
  }

  /* ---------- sincronizzazione col foglio ---------- */

  function statoFoglio(testo, allarme) {
    var e = $("stato-foglio");
    e.textContent = testo || "";
    e.className = allarme ? "nota allarme" : "nota";
  }

  function aggiornaCollega() {
    $("btn-collega").textContent = chiave ? "Scollega dal foglio" : "Collega al foglio";
    if (!chiave) { statoFoglio("Non collegato al foglio: i dati restano solo su questo telefono."); }
  }

  /* Un prodotto com'è scritto nel foglio: i dati della riga più il totale già calcolato. */
  function perFoglio(it) {
    var t = totale(it);
    return {
      id: it.id, ts: it.ts || 0, barcode: it.barcode || "", prodotto: it.prodotto || "", marca: it.marca || "",
      categoria: it.categoria || "", dove: it.dove, confQta: it.confQta || 0, confUnita: it.confUnita || "pz",
      chiuse: numero(it.chiuse, 0), aperta: !!it.aperta, residua: numero(it.residua, 0), resUnita: it.resUnita || "",
      totale: t.certo ? t.qta : "", totaleUnita: t.certo ? t.unita : "", scadenza: it.scadenza || "",
      kcal: it.kcal, proteine: it.proteine, carboidrati: it.carboidrati, grassi: it.grassi,
      nota: notaCsv(it, t), stato: it.stato || "ok", congelatoIl: it.congelatoIl || "", formato: it.formato || "",
      scadenzaStimata: !!it.scadenzaStimata
    };
  }

  function programmaSync() {
    if (!chiave) return;
    clearTimeout(timerSync);
    timerSync = setTimeout(sincronizza, 2500);
  }

  /* Il foglio risponde con lo stato fuso di tutti i telefoni: per ogni prodotto vince la modifica più recente. */
  function accogli(d) {
    var tolti = {};
    (d.eliminati || []).forEach(function (e) { tolti[e.id] = e.ts; });
    var arrivati = {};
    (d.giacenze || []).forEach(function (r) {
      if (!r || !r.id) return;
      arrivati[r.id] = true;
      var mio = items.get(r.id);
      if (!mio || numero(r.ts, 0) > numero(mio.ts, 0)) { items.set(r.id, migra(r)); }
    });
    items.forEach(function (it, id) {
      if (!arrivati[id] && tolti[id] !== undefined && tolti[id] >= numero(it.ts, 0)) { items.delete(id); }
    });
    lapidi.forEach(function (l) { if (tolti[l.id] === undefined || l.ts > tolti[l.id]) { tolti[l.id] = l.ts; } });
    lapidi = Object.keys(tolti).map(function (id) { return { id: id, ts: tolti[id] }; });

    var inLavoro = {}, inCoda = {};
    pendenti.forEach(function (p) { inLavoro[p.idRiga] = p; });
    coda.completati.concat(coda.ignorati).forEach(function (c) { inCoda[c.idRiga] = true; });
    pendenti = (d.pendenti || []).filter(function (p) { return !inCoda[p.idRiga]; }).map(function (p) {
      if (inLavoro[p.idRiga] && inLavoro[p.idRiga].mio) { p.mio = inLavoro[p.idRiga].mio; }
      return p;
    });
    salvaCoda();
    salva(true);
  }

  function sincronizza() {
    if (!chiave) return;
    if (inSync) { daRisincronizzare = true; return; }
    if (navigator.onLine === false) {
      statoFoglio("Senza rete: le modifiche restano sul telefono e partono appena torna.", true);
      return;
    }
    inSync = true;
    clearTimeout(timerSync);
    var spediti = { c: coda.completati.length, i: coda.ignorati.length, m: coda.movimenti.length };
    var corpo = {
      chiave: chiave, giacenze: Array.from(items.values()).map(perFoglio), eliminati: lapidi,
      completati: coda.completati, ignorati: coda.ignorati, movimenti: coda.movimenti
    };
    /* testo semplice: così il browser non fa una richiesta di controllo in più prima di quella vera */
    fetch(API, { method: "POST", headers: { "Content-Type": "text/plain;charset=UTF-8" }, body: JSON.stringify(corpo) })
      .then(function (r) { if (!r.ok) { throw new Error("HTTP " + r.status); } return r.json(); })
      .then(function (d) {
        inSync = false;
        if (d && d.ok === false && d.errore === "PAROLA_ERRATA") {
          chiave = "";
          try { localStorage.removeItem("chiave"); } catch (e) {}
          aggiornaCollega();
          statoFoglio("La parola d'ordine non è giusta: tocca «Collega al foglio» e riscrivila.", true);
          return;
        }
        if (!d || d.ok !== true) { throw new Error("risposta non valida"); }
        coda.completati.splice(0, spediti.c);
        coda.ignorati.splice(0, spediti.i);
        coda.movimenti.splice(0, spediti.m);
        accogli(d);
        statoFoglio("Foglio aggiornato alle " + oraAdesso() + ".");
        if (daRisincronizzare) { daRisincronizzare = false; programmaSync(); }
      })
      .catch(function () {
        inSync = false;
        statoFoglio("Non riesco a raggiungere il foglio: le modifiche restano sul telefono, riprovo da solo.", true);
      });
  }

  $("btn-collega").onclick = function () {
    if (chiave) {
      if (!confirm("Scollego questo telefono dal foglio? I dati restano qui, ma non vengono più inviati.")) return;
      chiave = "";
      try { localStorage.removeItem("chiave"); } catch (e) {}
      aggiornaCollega();
      return;
    }
    var p = prompt("Scrivi la parola d'ordine del foglio:", "");
    if (!p || !p.trim()) return;
    chiave = p.trim().toUpperCase();
    try { localStorage.setItem("chiave", chiave); } catch (e) {}
    aggiornaCollega();
    statoFoglio("Collegamento in corso…");
    sincronizza();
  };

  window.addEventListener("online", sincronizza);
  document.addEventListener("visibilitychange", function () { if (!document.hidden) { sincronizza(); } });

  /* ---------- avvio ---------- */

  try { chiave = localStorage.getItem("chiave") || ""; } catch (e) {}
  (function () {
    var c = leggiMemoria("coda", null);
    if (c && typeof c === "object") {
      ["completati", "ignorati", "movimenti"].forEach(function (k) { if (Array.isArray(c[k])) { coda[k] = c[k]; } });
    }
    var l = leggiMemoria("lapidi", []);
    lapidi = Array.isArray(l) ? l : [];
    var p = leggiMemoria("pendenti", []);
    pendenti = Array.isArray(p) ? p.filter(function (x) { return x && x.idRiga; }) : [];
    modo = leggiMemoria("modo", "ENTRATA") === "USCITA" ? "USCITA" : "ENTRATA";
  })();

  chips();
  modi();
  caricaRubrica();
  carica();
  render();
  aggiornaCollega();
  riprova();
  sincronizza();
})();
</script>
</body>
</html>
