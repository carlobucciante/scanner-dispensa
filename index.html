<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Scanner Dispensa</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<script src="https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js"></script>
<style>
  :root {
    --ground: #F7F6F1;
    --surface: #FFFFFF;
    --surface-2: #EFEEE7;
    --ink: #1D2019;
    --ink-soft: #6B7065;
    --line: #DCDAD0;
    --accent: #2E6B4F;
    --accent-ink: #FFFFFF;
    --amber: #9A6206;
    --amber-bg: #FBF2DE;
    --laser: #D6453C;
    --radius: 10px;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ground: #141713;
      --surface: #1D211C;
      --surface-2: #262B25;
      --ink: #EDEFE8;
      --ink-soft: #9AA093;
      --line: #333A32;
      --accent: #63C08F;
      --accent-ink: #10160F;
      --amber: #E0A445;
      --amber-bg: #2E2718;
      --laser: #E8635A;
    }
  }

  * { box-sizing: border-box; }
  html { color-scheme: light dark; }
  body {
    margin: 0;
    background: var(--ground);
    color: var(--ink);
    font-family: "IBM Plex Sans", system-ui, -apple-system, sans-serif;
    font-size: 15px;
    line-height: 1.45;
    -webkit-text-size-adjust: 100%;
  }
  img { max-width: 100%; }

  .wrap {
    max-width: 600px;
    margin: 0 auto;
    padding: 18px 16px 60px;
    display: flex;
    flex-direction: column;
    gap: 18px;
  }

  header { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; }
  h1 {
    font-family: Archivo, system-ui, sans-serif;
    font-weight: 700;
    font-size: 26px;
    letter-spacing: -0.01em;
    margin: 0;
    text-wrap: balance;
  }
  .sub { color: var(--ink-soft); font-size: 13px; margin: 2px 0 0; }
  .totale {
    font-family: "IBM Plex Mono", monospace;
    font-variant-numeric: tabular-nums;
    text-align: right;
    line-height: 1.1;
    white-space: nowrap;
  }
  .totale b { font-size: 22px; font-weight: 500; display: block; }
  .totale span { font-size: 11px; color: var(--ink-soft); text-transform: uppercase; letter-spacing: 0.06em; }

  .label {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--ink-soft);
    font-weight: 600;
    margin: 0 0 8px;
  }

  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip {
    font: inherit; font-weight: 500; font-size: 13px;
    padding: 7px 14px;
    border: 1px solid var(--line);
    background: var(--surface); color: var(--ink);
    border-radius: 999px; cursor: pointer;
  }
  .chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .chip:focus-visible, button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .camera {
    position: relative; aspect-ratio: 4 / 3;
    background: #0D0F0C;
    border: 1px solid var(--line); border-radius: var(--radius);
    overflow: hidden;
    display: flex; align-items: center; justify-content: center;
  }
  .camera video { width: 100%; height: 100%; object-fit: cover; display: block; }
  .camera.off video { display: none; }
  .mirino { position: absolute; inset: 14% 8%; border: 2px solid rgba(255,255,255,0.5); border-radius: 6px; pointer-events: none; display: none; }
  .camera.on .mirino { display: block; }
  .mirino::after {
    content: ""; position: absolute; left: 6px; right: 6px; top: 50%;
    height: 2px; background: var(--laser); box-shadow: 0 0 8px var(--laser);
    animation: sweep 2.4s ease-in-out infinite;
  }
  @keyframes sweep { 0%, 100% { transform: translateY(-38px); } 50% { transform: translateY(38px); } }
  @media (prefers-reduced-motion: reduce) { .mirino::after { animation: none; } }

  .camera-msg { position: absolute; padding: 20px; text-align: center; color: #E8EAE4; font-size: 14px; max-width: 330px; }
  .camera-msg b { display: block; font-family: Archivo, system-ui, sans-serif; font-size: 16px; margin-bottom: 6px; }
  .camera-msg .tecnico {
    display: block; margin-top: 12px; padding-top: 10px;
    border-top: 1px solid rgba(232,234,228,0.25);
    font-family: "IBM Plex Mono", monospace; font-size: 11px;
    color: #B9BFB2; word-break: break-word;
  }

  .flash { position: absolute; inset: 0; background: var(--accent); opacity: 0; pointer-events: none; }
  .flash.go { animation: pop 0.42s ease-out; }
  @keyframes pop { 0% { opacity: 0.75; } 100% { opacity: 0; } }

  button.primary {
    font: inherit; font-weight: 600; font-size: 15px;
    background: var(--accent); color: var(--accent-ink);
    border: none; border-radius: var(--radius);
    padding: 13px 18px; cursor: pointer; width: 100%;
  }
  button.ghost {
    font: inherit; font-size: 13px; font-weight: 500;
    background: transparent; color: var(--ink-soft);
    border: 1px solid var(--line); border-radius: var(--radius);
    padding: 10px 14px; cursor: pointer;
  }

  .azioni-camera { display: flex; gap: 8px; margin-top: 10px; }
  .azioni-camera button.primary { flex: 1; }
  .azioni-camera input[type="file"] { display: none; }

  .manuale { display: flex; gap: 8px; }
  .manuale input {
    font: inherit; flex: 1; min-width: 0;
    padding: 11px 12px;
    border: 1px solid var(--line); border-radius: var(--radius);
    background: var(--surface); color: var(--ink);
  }
  .manuale input#codice { font-family: "IBM Plex Mono", monospace; letter-spacing: 0.04em; }

  .sfuso { display: grid; grid-template-columns: 78px 1fr auto; gap: 8px; }
  .sfuso input, .sfuso select {
    font: inherit; min-width: 0; padding: 11px 10px;
    border: 1px solid var(--line); border-radius: var(--radius);
    background: var(--surface); color: var(--ink);
  }
  .sfuso input#sfuso { grid-column: 1 / -1; }
  .sfuso input#sfuso-qta { text-align: center; font-variant-numeric: tabular-nums; }
  @media (min-width: 520px) {
    .sfuso { grid-template-columns: 1fr 78px 130px auto; }
    .sfuso input#sfuso { grid-column: auto; }
  }

  .lista { display: flex; flex-direction: column; gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
  .riga { background: var(--surface); padding: 12px; display: flex; flex-direction: column; gap: 10px; }
  .riga.puntata { background: var(--amber-bg); }
  .riga .testa { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
  .riga input.titolo {
    font: inherit; font-weight: 600; font-size: 15px;
    width: 100%; padding: 4px 6px; margin: -4px 0 0 -6px;
    border: 1px solid transparent; border-radius: 6px;
    background: transparent; color: var(--ink);
  }
  .riga input.titolo:focus { border-color: var(--line); background: var(--surface); }
  .riga input.titolo::placeholder { font-weight: 500; font-style: italic; color: var(--ink-soft); }
  .riga .meta {
    font-family: "IBM Plex Mono", monospace; font-size: 11px;
    color: var(--ink-soft); font-variant-numeric: tabular-nums;
    letter-spacing: 0.04em; margin-top: 3px; overflow-wrap: break-word;
  }
  .riga .meta .sep { opacity: 0.45; margin: 0 5px; }
  .riga .somma {
    font-family: "IBM Plex Mono", monospace; font-variant-numeric: tabular-nums;
    font-size: 17px; white-space: nowrap; text-align: right;
  }
  .riga .somma.zero { color: var(--amber); }
  .riga .somma small { display: block; font-family: "IBM Plex Sans", sans-serif; font-size: 10px; text-transform: uppercase; letter-spacing: 0.07em; color: var(--ink-soft); }

  .comando { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .comando > .voce { font-size: 11px; text-transform: uppercase; letter-spacing: 0.07em; color: var(--ink-soft); font-weight: 600; min-width: 56px; }
  .stepper { display: flex; align-items: center; gap: 2px; }
  .stepper button {
    font: inherit; font-size: 17px; line-height: 1; width: 34px; height: 34px;
    border: 1px solid var(--line); background: var(--surface-2); color: var(--ink);
    border-radius: 8px; cursor: pointer;
  }
  .stepper .q { font-family: "IBM Plex Mono", monospace; font-variant-numeric: tabular-nums; min-width: 32px; text-align: center; font-size: 16px; }

  .frazioni { display: flex; gap: 4px; flex-wrap: wrap; }
  .frazioni button {
    font: inherit; font-size: 13px; min-width: 38px; height: 34px; padding: 0 8px;
    border: 1px solid var(--line); background: var(--surface-2); color: var(--ink);
    border-radius: 8px; cursor: pointer;
  }
  .frazioni button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .comando > button.frazione {
    font: inherit; font-size: 13px; min-width: 38px; height: 34px; padding: 0 8px;
    border: 1px dashed var(--line); background: transparent; color: var(--ink-soft);
    border-radius: 8px; cursor: pointer;
  }
  .resto {
    font: inherit; font-size: 14px; width: 92px; padding: 7px 8px; text-align: center;
    font-family: "IBM Plex Mono", monospace; font-variant-numeric: tabular-nums;
    border: 1px solid var(--line); border-radius: 8px;
    background: var(--surface); color: var(--ink);
  }
  select.unita {
    font: inherit; font-size: 14px; padding: 7px 8px;
    border: 1px solid var(--line); border-radius: 8px;
    background: var(--surface); color: var(--ink);
  }

  .coda { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; padding-top: 2px; }
  .coda label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.07em; color: var(--ink-soft); font-weight: 600; }
  .coda input[type="date"] { font: inherit; font-size: 13px; padding: 6px 8px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); color: var(--ink); }
  .coda .via { font: inherit; font-size: 12px; background: none; border: none; color: var(--ink-soft); cursor: pointer; text-decoration: underline; padding: 6px 0; margin-left: auto; }
  .riga.scade .coda label { color: var(--amber); }

  .vuoto { background: var(--surface); border: 1px dashed var(--line); border-radius: var(--radius); padding: 22px; }
  .vuoto p { margin: 0 0 10px; color: var(--ink-soft); font-size: 14px; }
  .vuoto ol { margin: 0; padding-left: 20px; color: var(--ink-soft); font-size: 14px; }
  .vuoto li { margin-bottom: 5px; }
  .vuoto li b { color: var(--ink); font-weight: 600; }

  .fine { display: flex; gap: 8px; flex-wrap: wrap; }
  .fine button.primary { width: auto; flex: 1; min-width: 200px; }
  .fine input[type="file"] { display: none; }

  .nota { font-size: 12px; color: var(--ink-soft); margin: 0; }
  .nota.allarme { color: var(--amber); font-weight: 500; }
</style>
</head>
<body>

<div class="wrap">
  <header>
    <div>
      <h1>Scanner Dispensa</h1>
      <p class="sub">Quanto c'è in casa, ripiano per ripiano.</p>
    </div>
    <div class="totale"><b id="tot-pezzi">0</b><span id="tot-voci">nessun prodotto</span></div>
  </header>

  <section>
    <p class="label">Dove stai guardando</p>
    <div class="chips" id="chips"></div>
  </section>

  <section>
    <div class="camera off" id="camera">
      <video id="video" playsinline muted></video>
      <div class="mirino"></div>
      <div class="flash" id="flash"></div>
      <div class="camera-msg" id="camera-msg"><b>Fotocamera spenta</b>Accendila e avvicina il codice a barre finché non senti il segnale.</div>
    </div>
    <div class="azioni-camera">
      <button class="primary" id="btn-camera">Accendi la fotocamera</button>
      <button class="ghost" id="btn-foto">Leggi da una foto</button>
      <input type="file" id="file-foto" accept="image/*">
    </div>
  </section>

  <section>
    <p class="label">Oppure scrivi il codice a mano</p>
    <div class="manuale">
      <input id="codice" inputmode="numeric" placeholder="codice a barre" autocomplete="off">
      <button class="ghost" id="btn-codice">Aggiungi</button>
    </div>
  </section>

  <section>
    <p class="label">Prodotti sfusi, senza codice</p>
    <div class="sfuso">
      <input id="sfuso" placeholder="pomodori, pane, mele…" autocomplete="off">
      <input id="sfuso-qta" inputmode="decimal" value="1" aria-label="quanto">
      <select id="sfuso-unita" aria-label="unità di misura">
        <option value="pz">pezzi</option>
        <option value="kg">kg</option>
        <option value="g">grammi</option>
        <option value="l">litri</option>
        <option value="ml">ml</option>
      </select>
      <button class="ghost" id="btn-sfuso">Aggiungi</button>
    </div>
  </section>

  <section>
    <p class="label">In casa</p>
    <div id="contenuto"></div>
    <p class="nota" id="stato" style="margin-top: 10px"></p>
  </section>

  <section class="fine">
    <button class="primary" id="btn-csv">Scarica il file per Claude</button>
    <button class="ghost" id="btn-import">Riparti da un file</button>
    <button class="ghost" id="btn-svuota">Svuota tutto</button>
    <input type="file" id="file-import" accept=".csv,text/csv">
  </section>
</div>

<script>
(function () {
  var LUOGHI = ["DISPENSA", "FRIGO", "FREEZER", "CANTINA"];
  var dove = "DISPENSA";
  var items = new Map();
  var editing = false;
  var puntato = "";
  var reader = null;
  var stream = null;
  var acceso = false;
  var motore = "";

  function $(id) { return document.getElementById(id); }
  var contenuto = $("contenuto"), stato = $("stato"), camera = $("camera"), msg = $("camera-msg");

  /* ---------- numeri ---------- */

  function numero(v, difetto) {
    var n = parseFloat(String(v).replace(",", "."));
    return isFinite(n) ? n : (difetto === undefined ? 0 : difetto);
  }

  function pulito(n) {
    return Math.round(n * 1000) / 1000;
  }

  function scritto(n) {
    return String(pulito(n)).replace(".", ",");
  }

  /* Legge "500 g", "1,5 L", "6 x 125 g" e ne ricava numero + unità. */
  function leggiFormato(testo) {
    var t = String(testo || "").toLowerCase().replace(",", ".");
    var molt = t.match(/(\d+)\s*[x×]\s*(\d+(?:\.\d+)?)\s*(kg|g|gr|l|lt|ml|cl)/);
    if (molt) {
      var tot = parseFloat(molt[1]) * parseFloat(molt[2]);
      return normalizza(tot, molt[3]);
    }
    var uno = t.match(/(\d+(?:\.\d+)?)\s*(kg|g|gr|l|lt|ml|cl)\b/);
    if (uno) { return normalizza(parseFloat(uno[1]), uno[2]); }
    return null;
  }

  function normalizza(q, u) {
    if (u === "gr") u = "g";
    if (u === "lt") u = "l";
    if (u === "cl") { q = q * 10; u = "ml"; }
    return { qta: q, unita: u };
  }

  /* ---------- memoria ---------- */

  /* Le prime versioni tenevano l'unità in `unita` e il residuo dentro `aperta`. */
  function migra(it) {
    if (it.confUnita === undefined) { it.confUnita = it.unita || "pz"; }
    if (typeof it.aperta === "number") {
      it.residua = it.aperta;
      it.resUnita = it.unita || it.confUnita;
      it.aperta = it.aperta > 0;
    }
    if (it.aperta === undefined) { it.aperta = false; }
    if (it.residua === undefined) { it.residua = 0; }
    if (it.resUnita === undefined) { it.resUnita = it.confUnita; }
    if (it.chiuse === undefined) { it.chiuse = 0; }
    if (it.confQta === undefined) { it.confQta = 0; }
    delete it.unita;
    return it;
  }

  function carica() {
    try {
      var raw = JSON.parse(localStorage.getItem("dispensa") || "[]");
      raw.forEach(function (it) { items.set(it.id, migra(it)); });
    } catch (e) {}
  }

  function salva() {
    try { localStorage.setItem("dispensa", JSON.stringify(Array.from(items.values()))); } catch (e) {}
    render();
  }

  /* Rubrica dei formati scritti a mano: barcode → quanto contiene una confezione.
     Serve per i prodotti che il catalogo non conosce, così li dichiari una volta sola. */
  var rubrica = {};

  function caricaRubrica() {
    try { rubrica = JSON.parse(localStorage.getItem("formati") || "{}"); } catch (e) { rubrica = {}; }
  }

  function ricorda(barcode, qta, unita) {
    if (!barcode || !(qta > 0)) return;
    rubrica[barcode] = { qta: qta, unita: unita };
    try { localStorage.setItem("formati", JSON.stringify(rubrica)); } catch (e) {}
  }

  /* ---------- conti ---------- */

  var UNITA = [["pz", "pezzi"], ["g", "grammi"], ["kg", "kg"], ["ml", "ml"], ["l", "litri"]];
  var PESO = { g: 1, kg: 1000 };
  var VOLUME = { ml: 1, l: 1000 };

  function famiglia(u) {
    if (PESO[u]) return "peso";
    if (VOLUME[u]) return "volume";
    return "pezzi";
  }

  /* Porta una quantità da un'unità all'altra, se sono parenti (g↔kg, ml↔l). */
  function converti(q, da, a) {
    if (da === a) return q;
    var f = famiglia(da);
    if (f !== famiglia(a)) return null;
    if (f === "pezzi") return q;
    var tab = (f === "peso") ? PESO : VOLUME;
    return q * tab[da] / tab[a];
  }

  function residuaIn(it, unita) {
    if (!it.aperta) return 0;
    var r = converti(numero(it.residua, 0), it.resUnita || unita, unita);
    return r === null ? 0 : r;
  }

  /* Quanto ce n'è in tutto: le confezioni intere più quel che resta in quella aperta. */
  function totale(it) {
    var u = it.confUnita || "pz";
    if (u === "pz") {
      return { qta: pulito(it.chiuse + (it.aperta ? numero(it.residua, 0) : 0)), unita: "pz", certo: true };
    }
    if (it.confQta > 0) {
      return { qta: pulito(it.chiuse * it.confQta + residuaIn(it, u)), unita: u, certo: true };
    }
    /* formato non ancora dichiarato: non posso sommare confezioni e residuo */
    return { qta: pulito(residuaIn(it, u)), unita: u, certo: false };
  }

  function totaleScritto(it) {
    var t = totale(it);
    if (t.unita === "pz") {
      return scritto(t.qta) + (t.qta === 1 ? " pezzo" : " pezzi");
    }
    if (t.certo) { return scritto(t.qta) + " " + t.unita; }
    var voci = [];
    if (it.chiuse > 0) { voci.push(it.chiuse + (it.chiuse === 1 ? " conf." : " conf.")); }
    if (it.aperta) { voci.push(scritto(numero(it.residua, 0)) + " " + (it.resUnita || t.unita)); }
    return voci.length ? voci.join(" + ") : "0";
  }

  /* ---------- interfaccia ---------- */

  function nota(testo, allarme) {
    stato.textContent = testo || "";
    stato.className = allarme ? "nota allarme" : "nota";
  }

  function chips() {
    var box = $("chips");
    box.innerHTML = "";
    LUOGHI.forEach(function (l) {
      var b = document.createElement("button");
      b.className = "chip";
      b.type = "button";
      b.textContent = l.charAt(0) + l.slice(1).toLowerCase();
      b.setAttribute("aria-pressed", String(l === dove));
      b.onclick = function () { dove = l; chips(); };
      box.appendChild(b);
    });
  }

  function ordinati() {
    return Array.from(items.values()).sort(function (a, b) { return (b.ts || 0) - (a.ts || 0); });
  }

  function render() {
    if (editing) return;
    var lista = ordinati();
    var finiti = lista.filter(function (it) { return totale(it).qta <= 0; }).length;
    $("tot-pezzi").textContent = lista.length;
    $("tot-voci").textContent = lista.length === 0 ? "nessun prodotto"
      : finiti > 0 ? (lista.length === 1 ? "1 prodotto" : "prodotti") + " · " + finiti + " finiti"
      : (lista.length === 1 ? "prodotto" : "prodotti");

    if (lista.length === 0) {
      contenuto.innerHTML = '<div class="vuoto"><p>Qui compare quello che hai in casa, con quanto ne resta.</p>' +
        "<ol><li>Scegli <b>dove</b> stai guardando: dispensa, frigo, freezer o cantina.</li>" +
        "<li>Passa i codici a barre davanti alla fotocamera: ogni prodotto entra con <b>una confezione chiusa</b>.</li>" +
        "<li>Se una confezione è <b>aperta</b>, dichiara quanto ne resta: metà, tre quarti, o il peso esatto.</li>" +
        "<li>Quello che non ha codice — pomodori, pane, mele — lo scrivi a peso qui sopra.</li></ol></div>";
      return;
    }

    var el = document.createElement("div");
    el.className = "lista";
    lista.forEach(function (it) { el.appendChild(riga(it)); });
    contenuto.innerHTML = "";
    contenuto.appendChild(el);

    if (puntato) {
      var vista = document.getElementById("r-" + puntato);
      if (vista && vista.scrollIntoView) { vista.scrollIntoView({ block: "center", behavior: "smooth" }); }
    }
  }

  function riga(it) {
    var t = totale(it);
    var r = document.createElement("div");
    r.className = "riga" + (it.scadenza ? " scade" : "") + (puntato === it.id ? " puntata" : "");
    r.id = "r-" + it.id;

    /* intestazione: nome, dati, totale */
    var testa = document.createElement("div");
    testa.className = "testa";

    var sx = document.createElement("div");
    sx.style.minWidth = "0";
    sx.style.flex = "1";
    var nome = document.createElement("input");
    nome.className = "titolo";
    nome.value = it.prodotto || "";

      .then(function (r) { return r.json(); })

        if (!p) {

          return;
        }
        var n = p.nutriments || {};
        it.prodotto = (p.product_name_it || p.product_name || "").trim();
        it.marca = (p.brands || "").split(",")[0].trim();
        it.formato = (p.quantity || "").trim();

        /* il formato: prima il campo numerico del catalogo, poi il testo libero */
        var qta = parseFloat(p.product_quantity);
        var um = String(p.product_quantity_unit || "").toLowerCase();
        if (it.confQta > 0) {
          /* formato già noto (l'hai scritto tu una volta): il catalogo non lo tocca */
        } else if (isFinite(qta) && qta > 0 && (PESO[um] || VOLUME[um])) {
          it.confQta = qta;
          it.confUnita = um;
          it.resUnita = um;
        } else {
          var f = leggiFormato(it.formato);
          if (f) {
            it.confQta = f.qta;
            it.confUnita = f.unita;
            it.resUnita = f.unita;
          } else {
            /* il catalogo non dice quanto contiene: meglio vuoto che un numero senza senso */
            it.confQta = 0;
          }

        it.kcal = n["energy-kcal_100g"];
        it.proteine = n.proteins_100g;
        it.carboidrati = n.carbohydrates_100g;
        it.grassi = n.fat_100g;
        it.stato = "ok";
        salva();

      .catch(function () {

  function beep(doppio) {
    try {
      var Ctx = window.AudioContext || window.webkitAudioContext;
      if (!Ctx) return;
      var ctx = new Ctx();
      var suona = function (quando, hz) {
        var o = ctx.createOscillator(), g = ctx.createGain();
        o.type = "square";
        o.frequency.value = hz;
        g.gain.setValueAtTime(0.09, ctx.currentTime + quando);
        g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + quando + 0.12);
        o.connect(g);
        g.connect(ctx.destination);
        o.start(ctx.currentTime + quando);
        o.stop(ctx.currentTime + quando + 0.13);
      };
      suona(0, doppio ? 820 : 1180);
      if (doppio) { suona(0.16, 820); }
      setTimeout(function () { ctx.close(); }, 700);
    } catch (e) {}
  }

      beep(true);
      lampeggia();
      setTimeout(function () { puntato = ""; render(); }, 4000);
      return;
    }

    var quantoSfuso = Math.max(0, numero(qta, 1));
    var unitaSfusa = unita || "pz";
    var it = {
      id: id, barcode: barcode || "", prodotto: nomeManuale || "", marca: "", formato: "",
      dove: dove,
      confQta: 0,
      confUnita: barcode ? "pz" : unitaSfusa,
      chiuse: barcode ? 1 : (unitaSfusa === "pz" ? quantoSfuso : 0),
      aperta: barcode ? false : (unitaSfusa !== "pz"),
      residua: (!barcode && unitaSfusa !== "pz") ? quantoSfuso : 0,

    setTimeout(function () { puntato = ""; render(); }, 4000);

        campo(it.aperta ? "SI" : "NO"),
        campo(it.aperta ? numero(it.residua, 0) : ""), campo(it.aperta ? (it.resUnita || "") : ""),
        campo(t.certo ? t.qta : ""), campo(t.certo ? t.unita : ""),
        campo(it.scadenza), campo(it.kcal), campo(it.proteine),
        campo(it.carboidrati), campo(it.grassi), campo(oggi),
        campo(it.stato === "ignoto" ? "codice non trovato in catalogo"
          : (!t.certo ? "formato non dichiarato: totale da calcolare" : ""))
      ].join(";"));
    });
    var blob = new Blob(["﻿" + righe.join("\r\n")], { type: "text/csv;charset=utf-8" });
    var a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "INVENTARIO_" + oggi + ".csv";
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 4000);
    nota("File scaricato: mettilo in Drive, nella cartella INVENTARIO_ALIMENTI.");
  };

  /* Legge un CSV con punto e virgola e virgolette. */
  function leggiCsv(testo) {
    var righe = [], riga = [], cella = "", dentro = false;
    testo = testo.replace(/^﻿/, "");
    for (var i = 0; i < testo.length; i++) {
      var c = testo[i];
      if (dentro) {
        if (c === '"') {
          if (testo[i + 1] === '"') { cella += '"'; i++; } else { dentro = false; }
        } else { cella += c; }
      } else if (c === '"') { dentro = true; }
      else if (c === ";") { riga.push(cella); cella = ""; }
      else if (c === "\n") { riga.push(cella); righe.push(riga); riga = []; cella = ""; }
      else if (c !== "\r") { cella += c; }
    }
    if (cella !== "" || riga.length) { riga.push(cella); righe.push(riga); }
    return righe;
  }

  $("btn-import").onclick = function () { $("file-import").click(); };

  $("file-import").onchange = function () {
    var f = this.files && this.files[0];
    if (!f) return;
    var lettore = new FileReader();
    lettore.onload = function () {
      try {
        var righe = leggiCsv(String(lettore.result));
        if (!righe.length) { nota("Il file è vuoto.", true); return; }
        var testa = righe[0].map(function (c) { return c.trim().toUpperCase(); });
        var col = function (r, nome) {
          var i = testa.indexOf(nome);
          return i >= 0 ? (r[i] || "").trim() : "";
        };
        var quanti = 0;
        righe.slice(1).forEach(function (r) {
          if (!r.length || r.join("").trim() === "") return;
          var barcode = col(r, "BARCODE");
          var prodotto = col(r, "PRODOTTO");
          var luogo = (col(r, "DOVE") || "DISPENSA").toUpperCase();
          var chiave = barcode || prodotto.toUpperCase().replace(/[^A-Z0-9]+/g, "_");
          if (!chiave) return;
          var id = luogo + "_" + chiave;
          items.set(id, {
            id: id, barcode: barcode, prodotto: prodotto, marca: col(r, "MARCA"),
            formato: "", dove: luogo,
            confQta: numero(col(r, "FORMATO_QTA"), 0),
            confUnita: col(r, "FORMATO_UNITA") || "pz",
            chiuse: numero(col(r, "CONFEZIONI"), 0),
            aperta: col(r, "APERTA").toUpperCase() === "SI",
            residua: numero(col(r, "RESIDUA"), 0),
            resUnita: col(r, "RESIDUA_UNITA") || col(r, "FORMATO_UNITA") || "pz",
            scadenza: col(r, "SCADENZA"),
            kcal: col(r, "KCAL_100G"), proteine: col(r, "PROTEINE_100G"),
            carboidrati: col(r, "CARBOIDRATI_100G"), grassi: col(r, "GRASSI_100G"),
            stato: "ok", ts: Date.now() - (quanti * 10)
          });
          quanti++;
        });
        salva();
        nota("Ripreso l'inventario: " + quanti + " prodotti caricati dal file.");
      } catch (e) {
        nota("Non riesco a leggere questo file: dev'essere un CSV scaricato da qui.", true);
      }
    };
    lettore.readAsText(f);
    this.value = "";
  };

  $("btn-svuota").onclick = function () {
    if (items.size === 0) return;
    if (!confirm("Cancello tutti i " + items.size + " prodotti? Scarica prima il file, altrimenti li perdi.")) return;
    items.clear();
    salva();
    nota("Lista svuotata.");
  };

  /* ---------- avvio ---------- */

  chips();
  caricaRubrica();
  carica();
  render();
})();
</script>
</body>
</html>
